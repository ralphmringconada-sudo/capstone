<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EcoBantay Auth Action</title>
  </head>
  <body>
    <p>Opening EcoBantay password reset…</p>
    <script>
      (function () {
        var params = window.location.search || "";
        var hash = window.location.hash || "";
        window.location.replace("/reset-password" + params + hash);
      })();
    </script>
  </body>
</html>
